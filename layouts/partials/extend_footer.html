{{- /* Busuanzi counters - only on pages with a post metadata container */ -}}
<script>
(function() {
  var postMeta = document.querySelector('.post-single .post-meta');
  if (!postMeta) return;

  function appendCounter(id, valueId, label) {
    if (document.getElementById(id)) return;

    var counter = document.createElement('span');
    counter.id = id;
    counter.style.display = 'none';
    counter.innerHTML = '&nbsp;·&nbsp;<span id="' + valueId + '"></span> ' + label;
    postMeta.appendChild(counter);
  }

  appendCounter('busuanzi_container_page_pv', 'busuanzi_value_page_pv', 'views');
  appendCounter('busuanzi_container_site_uv', 'busuanzi_value_site_uv', 'visitors');

  var script = document.createElement('script');
  script.async = true;
  script.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
  document.head.appendChild(script);
})();
</script>

{{- /* Mermaid diagram support */ -}}
<script type="module">
  if (document.querySelector('.mermaid')) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    mermaid.initialize({
      startOnLoad: false,
      theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default'
    });
    await mermaid.run({ querySelector: '.mermaid' });
  }
</script>
