<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#56708f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #162033; }
      .title { font-size: 52px; font-weight: 500; }
      .subtitle { font-size: 24px; fill: #667085; }
      .label { font-size: 27px; font-weight: 500; }
      .small { font-size: 21px; fill: #667085; }
      .micro { font-size: 18px; fill: #667085; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .blue { fill: #eaf2ff; stroke: #2563eb; stroke-width: 3; }
      .green { fill: #edf9f4; stroke: #15816f; stroke-width: 3; }
      .orange { fill: #fff2ed; stroke: #e05a3f; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="100" y="100" class="title">意图—结果配对：先留下可恢复的事实</text>
  <text x="100" y="146" class="subtitle">Intent → Effect → Result；最危险的崩溃发生在外部效果之后、结果落盘之前</text>

  <line x1="220" y1="335" x2="1380" y2="335" stroke="#cbd5e1" stroke-width="5"/>

  <circle cx="315" cy="335" r="38" fill="#2563eb"/>
  <text x="315" y="345" text-anchor="middle" font-size="27" fill="#ffffff">1</text>
  <rect x="150" y="205" width="330" height="100" rx="22" class="blue"/>
  <text x="315" y="247" text-anchor="middle" class="label">写入意图记录</text>
  <text x="315" y="280" text-anchor="middle" class="small">预分配 result_id = r-42</text>

  <circle cx="800" cy="335" r="38" fill="#7a5af8"/>
  <text x="800" y="345" text-anchor="middle" font-size="27" fill="#ffffff">2</text>
  <rect x="635" y="205" width="330" height="100" rx="22" fill="#f2efff" stroke="#7a5af8" stroke-width="3"/>
  <text x="800" y="247" text-anchor="middle" class="label">执行外部效果</text>
  <text x="800" y="280" text-anchor="middle" class="small">发送邮件 / 扣款 / 数据迁移</text>

  <circle cx="1285" cy="335" r="38" fill="#15816f"/>
  <text x="1285" y="345" text-anchor="middle" font-size="27" fill="#ffffff">3</text>
  <rect x="1120" y="205" width="330" height="100" rx="22" class="green"/>
  <text x="1285" y="247" text-anchor="middle" class="label">写入结果记录</text>
  <text x="1285" y="280" text-anchor="middle" class="small">使用同一个 result_id</text>

  <path d="M1032 280 l18 28 18-28 18 28 18-28 18 28 18-28" fill="none" stroke="#e05a3f" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="1085" cy="335" r="33" fill="#fff2ed" stroke="#e05a3f" stroke-width="3"/>
  <path d="M1070 320l30 30M1100 320l-30 30" stroke="#e05a3f" stroke-width="5" stroke-linecap="round"/>
  <text x="1085" y="397" text-anchor="middle" font-size="22" font-weight="500" fill="#c23d25">Crash Point</text>
  <text x="1085" y="427" text-anchor="middle" class="micro">效果可能已发生，结果尚未落盘</text>

  <text x="100" y="520" class="label">恢复时只做确定性判断</text>
  <rect x="100" y="560" width="330" height="180" rx="22" class="node"/>
  <text x="265" y="610" text-anchor="middle" class="label">结果 ID 是否存在？</text>
  <line x1="265" y1="642" x2="265" y2="696" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="205" y="675" class="small">存在</text>
  <rect x="185" y="698" width="160" height="38" rx="19" fill="#edf9f4"/>
  <text x="265" y="724" text-anchor="middle" font-size="19">跳过，不重复执行</text>

  <line x1="430" y1="650" x2="555" y2="650" stroke="#56708f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="466" y="631" class="small">不存在</text>
  <rect x="575" y="560" width="330" height="180" rx="22" class="node"/>
  <text x="740" y="610" text-anchor="middle" class="label">工具可安全重放？</text>
  <text x="740" y="648" text-anchor="middle" class="small">replay = safe / never</text>

  <line x1="905" y1="615" x2="1030" y2="615" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="955" y="594" class="small">safe</text>
  <rect x="1050" y="555" width="190" height="120" rx="22" class="blue"/>
  <text x="1145" y="610" text-anchor="middle" class="label">重新执行</text>
  <text x="1145" y="645" text-anchor="middle" class="small">使用持久化参数</text>

  <line x1="905" y1="690" x2="1030" y2="690" stroke="#e05a3f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="955" y="676" class="small">never</text>
  <rect x="1050" y="695" width="430" height="100" rx="22" class="orange"/>
  <text x="1265" y="736" text-anchor="middle" class="label">写入合成的中断结果</text>
  <text x="1265" y="770" text-anchor="middle" class="small">如实告诉模型：结果未知</text>

  <rect x="100" y="805" width="1380" height="48" rx="18" fill="#eaf2ff"/>
  <text x="790" y="837" text-anchor="middle" font-size="21" font-weight="500">恢复目标不是证明外部世界发生了什么，而是把本地状态恢复成模型能够继续理解的历史。</text>
</svg>
